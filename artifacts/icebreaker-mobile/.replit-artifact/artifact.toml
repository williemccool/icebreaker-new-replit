kind = "mobile"
previewPath = "/icebreaker-mobile/"
title = "Icebreaker Mobile"
version = "1.0.0"
id = "artifacts/icebreaker-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/icebreaker-mobile/" ]
localPort = 21585

[services.development]
run = "EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=$VITE_CLERK_PUBLISHABLE_KEY EXPO_PACKAGER_PROXY_URL=https://$REPLIT_EXPO_DEV_DOMAIN EXPO_PUBLIC_DOMAIN=$REPLIT_DEV_DOMAIN EXPO_PUBLIC_REPL_ID=$REPL_ID REACT_NATIVE_PACKAGER_HOSTNAME=$REPLIT_DEV_DOMAIN pnpm exec expo start --localhost --port $PORT"

[services.production]
build = [ "pnpm", "--filter", "@workspace/icebreaker-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/icebreaker-mobile", "run", "serve" ]

[services.env]
PORT = "21585"
BASE_PATH = "/icebreaker-mobile/"
