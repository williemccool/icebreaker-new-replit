kind = "web"
previewPath = "/"
title = "Icebreaker"
version = "1.0.0"
id = "artifacts/icebreaker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20297

[services.development]
run = "pnpm --filter @workspace/icebreaker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/icebreaker", "run", "build" ]
publicDir = "artifacts/icebreaker/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20297"
BASE_PATH = "/"
